site_name: wardcat
site_description: PII detection and anonymization for LLM inputs — hybrid regex + NER + on-prem LLM.
site_url: https://docs.wardcat.com/
repo_url: https://github.com/oguzhantopcu0/wardcat
repo_name: oguzhantopcu0/wardcat
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.png
  favicon: assets/logo.png
  palette:
    # Dark neon is the default; a light toggle is still available.
    - scheme: slate
      primary: black
      accent: purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: black
      accent: purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

# Feeds the "What's new" card in the right-hand column (overrides/partials/toc.html).
# Keep it to the handful of changes worth interrupting a reader for; the card
# links to the changelog for the rest.
extra:
  whats_new_version: "1.2.0"
  whats_new:
    - title: Reversible masking
      note: tokenize out, restore the answer
      link: guide/reversible/
    - title: Eight checksum-verified filters
      note: wallets, NHS, ABA routing, IMEI, EU IDs
      link: guide/layers/#regex
    - title: Confidence floor
      note: min_confidence decides what is acted on
      link: guide/configuration/#confidence-floor
    - title: USERNAME and in-sentence credentials
      note: cued by the word beside them
      link: guide/layers/#regex
    - title: LOCATION and NRP split out of NER
      note: place names and Article 9 data get their own types
      link: guide/layers/#spacy-ner-ner
    - title: libphonenumber phone regions
      note: national formats beyond TR/FR/DE
      link: guide/configuration/#phone-regions

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: sphinx
            show_source: true
            show_root_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            separate_signature: true
            signature_crossrefs: true
            merge_init_into_class: true
            members_order: source
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [.]
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Installation: installation.md
  - Quickstart: quickstart.md
  - Guide:
      - Detection layers: guide/layers.md
      - Configuration & policy: guide/configuration.md
      - Reversible masking: guide/reversible.md
      - Extending: guide/extending.md
      - MCP server: guide/mcp-server.md
      - Security: guide/security.md
  - API reference:
      - Wardcat: reference/wardcat.md
      - Results & constants: reference/models.md
      - Detectors & backends: reference/internals.md
  - Changelog: changelog.md
