name: CI

on:
  # Every branch of the promotion path runs the full suite on push:
  # dev (work in progress) -> test/* (integration) -> staging (passed) -> main.
  push:
    branches: ["main", "staging", "dev", "test/**"]
  # The gate: run on every pull request (any base branch) so nothing reaches
  # main without a green lint + test + build run.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy type check
        run: uv run mypy

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          # One Windows job: the ReDoS probe cannot kill itself there (no
          # setitimer) and falls back to the parent's subprocess timeout, and
          # nothing else in the library is platform-specific — one version is
          # enough to keep it honest.
          - os: windows-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }} --dev

      - name: Run tests
        # bash on every runner: the Windows default is PowerShell, which does
        # not read the backslash line continuations below.
        shell: bash
        run: |
          uv run pytest tests/unit/ tests/integration/ tests/benchmark/ \
            --tb=short \
            -q \
            --cov=src/wardcat \
            --cov-report=term-missing \
            --cov-fail-under=80

  build:
    name: Build & check wheel
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Build wheel and sdist
        run: uv build

      - name: Check distribution
        run: uv run --with twine twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  docs:
    name: Docs build (strict)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Build docs (strict — fails on broken links/refs)
        run: uv run --group docs mkdocs build --strict

  minimal-install:
    # The wheel in a bare virtual environment, no extras, no dev tools: the
    # `wardcat` command must work there, and `import wardcat` must stay lean.
    # The dev environment cannot show this — SpaCy brings typer and rich along.
    name: Minimal install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - name: Install the wheel alone
        shell: bash
        run: |
          python -m venv bare
          bin=bare/bin; [ -d "$bin" ] || bin=bare/Scripts
          echo "BARE=$bin" >> "$GITHUB_ENV"
          "$bin/python" -m pip install --quiet dist/*.whl
      - name: The command works without extras
        shell: bash
        run: |
          set -u
          "$BARE/wardcat" --version
          "$BARE/wardcat" --help > /dev/null
          set +e
          out=$(printf 'mail ali@example.com\n' | "$BARE/wardcat" scan --entity EMAIL); code=$?
          set -e
          [ "$code" = 1 ] && [ "$out" = "[EMAIL]" ] || { echo "scan: exit $code, got '$out'"; exit 1; }
          set +e; "$BARE/wardcat" check tests/fixtures/cli/leaky --quiet; code=$?; set -e
          [ "$code" = 1 ] || { echo "check leaky: exit $code"; exit 1; }
          "$BARE/wardcat" check tests/fixtures/cli/clean --quiet
      - name: Turkish text survives a pipe
        shell: bash
        run: |
          set +e
          out=$(printf 'Şükrü, İzmir: 4111 1111 1111 1111\n' | "$BARE/wardcat" scan --entity CREDIT_CARD); code=$?
          set -e
          [ "$code" = 1 ] && [ "$out" = "Şükrü, İzmir: [CREDIT_CARD]" ] || { echo "got '$out' (exit $code)"; exit 1; }
      - name: import wardcat loads no CLI or server code
        shell: bash
        run: |
          "$BARE/python" -c "import sys, wardcat; bad=[m for m in sys.modules if m.startswith(('wardcat.cli','argparse','starlette','uvicorn','typer','rich'))]; assert not bad, bad"

  pre-commit-hook:
    name: pre-commit hook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: The hook blocks a leaky file and passes a clean one
        run: |
          python -m pip install --quiet pre-commit
          if pre-commit try-repo . wardcat --files tests/fixtures/cli/leaky/settings.py; then
            echo "the hook passed a file with a secret and a card"; exit 1
          fi
          pre-commit try-repo . wardcat --files tests/fixtures/cli/clean/readme.txt

  action-selftest:
    name: GitHub Action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run the action on a leaky directory
        id: leaky
        continue-on-error: true
        uses: ./
        with:
          paths: tests/fixtures/cli/leaky
      - name: It must have failed
        if: steps.leaky.outcome != 'failure'
        run: echo "the action passed a directory with a secret and a card" && exit 1
      - name: Run the action on a clean directory, writing SARIF
        uses: ./
        with:
          paths: tests/fixtures/cli/clean
          format: sarif
          output: wardcat.sarif
      - name: The SARIF report is valid JSON
        run: python3 -c "import json; d=json.load(open('wardcat.sarif')); assert d['version']=='2.1.0'"
